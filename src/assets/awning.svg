<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="64" height="48">
  <!-- Um gomo do toldo. Repetido na horizontal pelo CSS.
       Barra superior com costura dourada, gomo com volume (sombreado nas dobras e
       brilho no centro) e acabamento em filete cobre, como o quadro da placa. -->
  <defs>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b522a"/>
      <stop offset="0.35" stop-color="#21612f"/>
      <stop offset="1" stop-color="#174722"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06180b" stop-opacity="0.38"/>
      <stop offset="0.2" stop-color="#06180b" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#06180b" stop-opacity="0"/>
      <stop offset="1" stop-color="#06180b" stop-opacity="0.38"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.38" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- A barra superior e a costura são desenhadas no CSS (faixa contínua, sem emendas). -->

  <path d="M0 16 H64 V21 C64 35.5 50 44 32 44 C14 44 0 35.5 0 21 Z" fill="url(#flap)"/>
  <path d="M0 16 H64 V21 C64 35.5 50 44 32 44 C14 44 0 35.5 0 21 Z" fill="url(#fold)"/>
  <path d="M0 16 H64 V21 C64 35.5 50 44 32 44 C14 44 0 35.5 0 21 Z" fill="url(#sheen)"/>
  <rect y="16" width="64" height="1.6" fill="#0b2a12" opacity="0.55"/>

  <path d="M0.6 21.5 C0.8 35 14.5 43 32 43 C49.5 43 63.2 35 63.4 21.5" fill="none" stroke="#c08550" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M2 22 C2.5 34 15 41.4 32 41.4 C49 41.4 61.5 34 62 22" fill="none" stroke="#e2a874" stroke-opacity="0.45" stroke-width="0.8"/>
</svg>
